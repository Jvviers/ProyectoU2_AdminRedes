# PostgreSQL Replication Settings
wal_level = replica
max_wal_senders = 5
hot_standby = on
password_encryption = scram-sha-256

# Logging y auditoría básica
log_destination = 'stderr'
logging_collector = on
log_connections = on
log_disconnections = on
log_duration = on
log_statement = 'none'
log_line_prefix = '%m [%p] %u@%d %h '
log_hostname = off
