server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_logging_jobname']
        target_label: 'job'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      - match:
          selector: '{job="security-gateway"}'
          stages:
            - regex:
                expression: '^(?P<remote_addr>[^ ]*) [^ ]* [^ ]* \[(?P<time_local>[^\]]*)\] "(?P<method>[A-Z]+) (?P<uri>[^ ]*) [^"]*" (?P<status>\d{3}) (?P<body_bytes_sent>\d+) "(?P<referer>[^"]*)" "(?P<user_agent>[^"]*)"(?P<rest>.*)$'
            - labels:
                status:
            - match:
                selector: '{status!~"401|403|429"}'
                action: drop
      - match:
          selector: '{job="security-app"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: message
                  status: status
                  path: path
                  user: user
            - labels:
                level:
                status:
                path:
